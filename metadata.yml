type: LearningResource
name: Five Questions for Debriefing Simulation Games
description: >-
  Bilingual open educational resource for higher education and professional training on
  structured debriefing of simulation games. The guide adapts the Five Questions
  facilitation model described by Micah Jacobson and Mari Ruddy in Open to Outcome
  (2nd ed., 2015) and provides facilitator guidance, optional follow-up prompts, and
  worked examples for a project-management simulation and the Beer Distribution Game.
